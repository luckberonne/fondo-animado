# Fondo Animado (com.lucas.livewallpaper): decodificar el video en la iGPU AMD, sin copias y sin despertar la NVIDIA.
# FFmpeg/VAAPI siempre abre /dev/dri/renderD128 (= NVIDIA en esta laptop) y Qt no deja elegir otro.
# Dentro del espacio de nombres de plasmashell, renderD128 pasa a ser el nodo de la AMD (renderD129):
# VAAPI decodifica en la AMD y Qt importa los fotogramas como textura (DMA-BUF), sin pasar por la CPU.
[Service]
BindPaths=/dev/dri/renderD129:/dev/dri/renderD128
Environment=QT_FFMPEG_DECODING_HW_DEVICE_TYPES=vaapi
Environment=QT_FFMPEG_ENCODING_HW_DEVICE_TYPES=vaapi
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json
