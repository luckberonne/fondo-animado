# Fondo Animado (com.lucas.livewallpaper): decodificar el video en la iGPU AMD sin despertar la NVIDIA.
# - VAAPI de FFmpeg abre el primer nodo (renderD128 = NVIDIA): se usa Vulkan en su lugar.
# - VK_DRIVER_FILES: el cargador de Vulkan solo ve RADV (si no, abre /dev/nvidia* al enumerar).
# - LIBVA_DRIVER_NAME: evita que Qt inicialice el VAAPI de NVIDIA al sondear.
[Service]
Environment=QT_FFMPEG_DECODING_HW_DEVICE_TYPES=vulkan
Environment=QT_FFMPEG_ENCODING_HW_DEVICE_TYPES=vulkan
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json
Environment=LIBVA_DRIVER_NAME=radeonsi
